name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本标签必须是 vX.Y.Z，当前为 $GITHUB_REF_NAME"
            exit 1
          fi
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          echo "clean=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装并测试前端
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

      - name: 安装并测试后端
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
          ruff check app/ tests/
          python -m pytest tests/ -v

      - name: Release Secrets 预检
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY \
            MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD \
            MACOS_CERTIFICATE_NAME APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "缺少必要配置: $name"; exit 1; }
          done

      - name: 导入 Developer ID 证书
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/stock-helper-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/identities.txt"
          grep -F "$MACOS_CERTIFICATE_NAME" "$RUNNER_TEMP/identities.txt"
          rm -f "$CERT_PATH"

      - name: 构建、签名并公证应用
        env:
          VERSION: ${{ steps.version.outputs.clean }}
          RELEASE_MODE: '1'
          ENABLE_SPARKLE: '1'
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          GITHUB_API_TOKEN: ${{ github.token }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x packaging/macos/build_app.sh
          packaging/macos/build_app.sh

      - name: 最终产物冒烟测试
        run: |
          chmod +x packaging/macos/smoke_test.sh
          packaging/macos/smoke_test.sh "dist/股票分析助手.app" "${{ steps.version.outputs.clean }}"

      - name: 验证签名与公证票据
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/股票分析助手.app"
          xcrun stapler validate "dist/股票分析助手.app"
          spctl --assess --type execute --verbose=2 "dist/股票分析助手.app"

      - name: Sparkle EdDSA 签名并生成 appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.clean }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="dist/StockHelper-${VERSION}.zip"
          SIGN_TOOL="dist/sparkle-tools/sign_update"
          [[ -x "$SIGN_TOOL" ]] || { echo "找不到 sign_update"; exit 1; }
          SIGN_OUTPUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" --ed-key-file - "$ZIP_FILE")"
          SIGNATURE="$(printf '%s\n' "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' | head -1)"
          [[ -n "$SIGNATURE" ]] || { echo "无法提取 Sparkle 签名"; exit 1; }
          python packaging/macos/generate_appcast.py \
            "$ZIP_FILE" "$VERSION" "$SIGNATURE" "dist/appcast.xml"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('dist/appcast.xml').getroot()
          enclosure = root.find('./channel/item/enclosure')
          assert enclosure is not None
          signature = enclosure.attrib.get(
              '{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature'
          )
          assert signature
          assert enclosure.attrib['url'].endswith('.zip')
          print('appcast XML 验证通过')
          PY

      - name: 创建正式 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 股票分析助手 v${{ steps.version.outputs.clean }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/StockHelper-${{ steps.version.outputs.clean }}.zip
            dist/appcast.xml
          body: |
            ## 股票分析助手 v${{ steps.version.outputs.clean }}

            - 更新前自动备份客户资料
            - 应用已完成 Developer ID 签名与 Apple 公证
            - 本分析仅供参考，不构成投资建议
          draft: false
          prerelease: false

      - name: 清理临时 Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/stock-helper-build.keychain-db" 2>/dev/null || true
