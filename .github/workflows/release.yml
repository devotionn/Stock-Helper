name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # 提到 job 级，使签名步骤的 if 条件能正确判断 secret 是否存在
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: |
          cd frontend && npm ci && npm run build

      - name: 安装后端测试依赖
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行后端测试
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Release Secrets 预检
        run: |
          required_vars=(
            "SPARKLE_PUBLIC_KEY=${{ secrets.SPARKLE_PUBLIC_KEY }}"
            "SPARKLE_PRIVATE_KEY=${{ secrets.SPARKLE_PRIVATE_KEY }}"
            "MACOS_CERTIFICATE_P12_BASE64=${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}"
            "MACOS_CERTIFICATE_PASSWORD=${{ secrets.MACOS_CERTIFICATE_PASSWORD }}"
            "MACOS_CERTIFICATE_NAME=${{ secrets.MACOS_CERTIFICATE_NAME }}"
            "APPLE_ID=${{ secrets.APPLE_ID }}"
            "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            "APPLE_APP_PASSWORD=${{ secrets.APPLE_APP_PASSWORD }}"
          )
          
          for var_line in "${required_vars[@]}"; do
            var_name="${var_line%%=*}"
            var_value="${var_line#*=}"
            if [ -z "$var_value" ]; then
              echo "❌ 缺少必要配置：$var_name"
              exit 1
            else
              echo "✅ $var_name 已配置"
            fi
          done
          
          echo "所有必要配置已就绪"

      - name: 导入 Developer ID 证书
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # 创建临时 Keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 导入证书
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          
          # 设置签名权限
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 添加到搜索列表
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | tr -d '\"')"
          
          echo "证书导入成功"

      - name: 安装后端依赖
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包 .app
        env:
          APP_VERSION: ${{ github.ref_name }}
          REQUIRE_SPARKLE: "1"
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x packaging/macos/build_app.sh
          VERSION=$APP_VERSION REQUIRE_SPARKLE=1 bash packaging/macos/build_app.sh
          # 暴露不带 v 前缀的版本号供后续步骤使用（build_app.sh 内部已去 v 前缀）
          echo "APP_VERSION_CLEAN=${APP_VERSION#v}" >> $GITHUB_ENV

      - name: Sparkle EdDSA 签名
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          APP_VERSION_CLEAN="${{ github.ref_name }}"
          APP_VERSION_CLEAN="${APP_VERSION_CLEAN#v}"
          ZIP_FILE="dist/StockHelper-${APP_VERSION_CLEAN}.zip"
          
          # 查找 sign_update 工具
          SIGN_TOOL=$(find /tmp/sparkle_extract -name "sign_update" -type f 2>/dev/null | head -1)
          
          if [ -z "$SIGN_TOOL" ]; then
            echo "错误: 找不到 sign_update 工具"
            exit 1
          fi
          
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "错误: 缺少 SPARKLE_PRIVATE_KEY secret"
            exit 1
          fi
          
          # 通过 stdin 传私钥签名
          SIGN_OUTPUT=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" --ed-key-file - "$ZIP_FILE" 2>&1)
          echo "签名输出: $SIGN_OUTPUT"
          
          # 提取 edSignature 的值（格式: sparkle:edSignature="xxx" length="yyy"）
          SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -o 'edSignature="[^"]*"' | head -1 | sed 's/edSignature="//;s/"//')
          
          if [ -z "$SIGNATURE" ]; then
            echo "错误: 签名提取失败"
            exit 1
          fi
          
          echo "SIGNATURE=$SIGNATURE" >> $GITHUB_ENV
          echo "签名成功: $SIGNATURE"

      - name: 生成 appcast
        run: |
          # 直接使用 build_app.sh 产物（已通过 ditto 生成 zip），不再重新压缩
          python packaging/macos/generate_appcast.py "dist/StockHelper-${APP_VERSION_CLEAN}.zip" "${APP_VERSION_CLEAN}" "dist/appcast.xml"

      - name: 注入签名到 appcast
        run: |
          if [ -n "$SIGNATURE" ]; then
            sed -i '' "s|sparkle:edSignature=\"\"|sparkle:edSignature=\"$SIGNATURE\"|" dist/appcast.xml
            echo "签名已注入 appcast.xml"
          else
            echo "错误: 签名为空，不能发布"
            exit 1
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StockHelper-${{ env.APP_VERSION_CLEAN }}.zip
            dist/appcast.xml
          body: |
            ## 股票助手 v${{ env.APP_VERSION_CLEAN }}

            ### 更新内容
            - 请在此处填写更新说明

            ### 说明
            - 不会删除您的文字、图片和历史记录
            - 本分析仅供参考，不构成投资建议
          draft: false
          prerelease: false

      - name: 清理 Keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
