name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff 检查
        run: |
          cd backend
          ruff check app/
      - name: 运行测试
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: |
          cd frontend
          npm ci
      - name: ESLint 检查
        run: |
          cd frontend
          npm run lint
      - name: 构建
        run: |
          cd frontend
          npm run build

  macos-build:
    runs-on: macos-15
    needs: [backend-test, frontend-build]
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build
      - name: 安装后端依赖
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
      - name: PyInstaller 打包
        run: |
          pyinstaller packaging/macos/stock-helper.spec --noconfirm
      - name: 组装 .app
        run: |
          chmod +x packaging/macos/build_app.sh
          bash packaging/macos/build_app.sh
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StockHelper-macOS
          path: dist/股票分析助手.app
