name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 静态检查与测试
        run: |
          cd backend
          ruff check app/ tests/
          python -m pytest tests/ -v

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装、检查并构建
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  macos-build:
    runs-on: macos-15
    timeout-minutes: 30
    needs: [backend-test, frontend-test]
    env:
      SMOKE_KEYCHAIN: ${{ runner.temp }}/stock-helper-smoke.keychain-db
      SMOKE_KEYCHAIN_PASSWORD: stock-helper-ci-keychain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 准备无交互测试 Keychain
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "$SMOKE_KEYCHAIN" >/dev/null 2>&1 || true
          security create-keychain -p "$SMOKE_KEYCHAIN_PASSWORD" "$SMOKE_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SMOKE_KEYCHAIN"
          security unlock-keychain -p "$SMOKE_KEYCHAIN_PASSWORD" "$SMOKE_KEYCHAIN"
          security default-keychain -d user -s "$SMOKE_KEYCHAIN"
          security list-keychains -d user -s "$SMOKE_KEYCHAIN"

      - name: 构建含 Sparkle 的无签名内部测试版
        env:
          VERSION: 0.0.0
          RELEASE_MODE: '0'
          ENABLE_SPARKLE: '1'
          # 仅用于编译和 Info.plist 结构测试；正式版必须使用项目自己的真实公钥。
          SPARKLE_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          chmod +x packaging/macos/build_app.sh
          packaging/macos/build_app.sh
          test -d "dist/股票分析助手.app/Contents/Frameworks/Sparkle.framework"
          test -x "dist/sparkle-tools/sign_update"

      - name: 运行应用、SQLite 与 Keychain 冒烟测试
        env:
          TEST_KEYCHAIN: '1'
        run: |
          chmod +x packaging/macos/smoke_test.sh
          packaging/macos/smoke_test.sh "dist/股票分析助手.app" "0.0.0"

      - name: 上传测试产物
        uses: actions/upload-artifact@v4
        with:
          name: StockHelper-macOS-arm64-unsigned
          path: dist/StockHelper-0.0.0.zip
          if-no-files-found: error

      - name: 清理测试 Keychain
        if: always()
        run: |
          security delete-keychain "$SMOKE_KEYCHAIN" >/dev/null 2>&1 || true
