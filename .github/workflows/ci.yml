name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 静态检查与测试
        run: |
          cd backend
          ruff check app/ tests/
          python -m pytest tests/ -v

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装、检查并构建
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  macos-build:
    runs-on: macos-15
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建无签名内部测试版
        env:
          VERSION: 0.0.0
          RELEASE_MODE: '0'
          ENABLE_SPARKLE: '0'
        run: |
          chmod +x packaging/macos/build_app.sh packaging/macos/smoke_test.sh
          packaging/macos/build_app.sh
          packaging/macos/smoke_test.sh "dist/股票分析助手.app" "0.0.0"
      - name: 上传测试产物
        uses: actions/upload-artifact@v4
        with:
          name: StockHelper-macOS-arm64-unsigned
          path: dist/StockHelper-0.0.0.zip
          if-no-files-found: error
